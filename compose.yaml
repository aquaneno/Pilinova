services:
  pilinova:
    build: .
    image: pilinova:local
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      ADMIN_COOKIE_SECURE: "${ADMIN_COOKIE_SECURE:-true}"
    ports:
      - target: 8080
        published: "${PORT:-8080}"
        host_ip: "${BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - pilinova-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m

volumes:
  pilinova-data:
